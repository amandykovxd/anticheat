name: build-and-test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-and-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kernel-driver:
    name: windows x64 kernel driver
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v7

      - name: Restore WDK NuGet packages
        shell: pwsh
        run: |
          nuget restore driver\packages.config -PackagesDirectory driver\packages
          if ($LASTEXITCODE -ne 0) {
            throw "nuget restore exited with $LASTEXITCODE"
          }

      - name: Build WDK driver
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -products * `
            -requires Microsoft.Component.MSBuild `
            -find 'MSBuild\**\Bin\MSBuild.exe' |
            Select-Object -First 1
          if (-not $msbuild) {
            throw 'MSBuild was not found'
          }
          $output = Join-Path $PWD 'out\driver\x64\Release'
          New-Item -ItemType Directory -Force $output | Out-Null
          & $msbuild 'driver\AcTelemetry.vcxproj' `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:DebugSymbols=true `
            /p:DebugType=full `
            /p:SignMode=Off `
            "/p:OutDir=$output\"
          if ($LASTEXITCODE -ne 0) {
            throw "driver build exited with $LASTEXITCODE"
          }
          $driver = Join-Path $output 'AcTelemetry.sys'
          if (-not (Test-Path $driver)) {
            throw 'AcTelemetry.sys was not produced'
          }
          $symbols = Get-ChildItem $output -Filter '*.pdb' -File
          if (-not $symbols) {
            throw 'Driver symbols were not produced'
          }

          $inf = Join-Path $output 'AcTelemetry.inf'
          Copy-Item 'driver\AcTelemetry.inf' $inf
          $infVerif = Get-ChildItem 'driver\packages' `
            -Filter 'InfVerif.exe' `
            -File `
            -Recurse |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $infVerif) {
            throw 'The pinned SDK package did not provide x64 InfVerif.exe'
          }

          $validation = Join-Path $output 'InfVerif.txt'
          $validationOutput = & $infVerif.FullName /w /v $inf 2>&1
          $validationExitCode = $LASTEXITCODE
          $validationOutput | Tee-Object -FilePath $validation
          if ($validationExitCode -ne 0) {
            throw "InfVerif exited with $validationExitCode"
          }

          $checksumPath = Join-Path $output 'SHA256SUMS'
          Get-ChildItem $output -File |
            Where-Object { $_.Name -ne 'SHA256SUMS' } |
            Sort-Object Name |
            ForEach-Object {
              $digest = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
              "$digest  $($_.Name)"
            } |
            Set-Content -Encoding ascii $checksumPath

      - name: Upload unsigned driver package
        uses: actions/upload-artifact@v7
        with:
          name: AcTelemetry-unsigned-x64
          path: out/driver/x64/Release
          if-no-files-found: error

  windows:
    name: windows ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            preset: windows-x64
            binary_dir: out/build/windows-x64
            install_dir: out/install/windows-x64
          - arch: Win32
            preset: windows-win32
            binary_dir: out/build/windows-win32
            install_dir: out/install/windows-win32

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}-release

      - name: Verify automated test inventory
        shell: pwsh
        run: |
          $inventory = (
            & ctest --preset ${{ matrix.preset }}-release --show-only=json-v1 |
              Out-String |
              ConvertFrom-Json
          )
          if ($inventory.tests.Count -ne 56) {
            throw "Expected 56 independent tests, found $($inventory.tests.Count)"
          }

      - name: Test
        run: ctest --preset ${{ matrix.preset }}-release

      - name: End-to-end scan against a live process
        shell: pwsh
        run: |
          $collector = Join-Path '${{ matrix.binary_dir }}' 'Release\anticheat.exe'
          if ('${{ matrix.arch }}' -eq 'Win32') {
            $targetExecutable = Join-Path $env:WINDIR `
              'SysWOW64\WindowsPowerShell\v1.0\powershell.exe'
          } else {
            $targetExecutable = (Get-Command powershell).Source
          }
          $target = Start-Process -PassThru -FilePath $targetExecutable `
            -ArgumentList '-NoProfile','-Command','Start-Sleep -Seconds 120'
          try {
            & $collector --pid $target.Id --once --quiet --log smoke.jsonl
            if ($LASTEXITCODE -ne 0) {
              throw "agent exited with $LASTEXITCODE"
            }
          } finally {
            Stop-Process -Id $target.Id -Force -ErrorAction SilentlyContinue
          }
          $events = Get-Content smoke.jsonl | ForEach-Object { $_ | ConvertFrom-Json }
          if (-not ($events.event -contains 'collector_identity_observed')) {
            throw 'collector identity event is missing from the smoke log'
          }
          if (-not ($events.event -contains 'scan_completed')) {
            throw 'scan completion event is missing from the smoke log'
          }
          Get-Content smoke.jsonl | Select-Object -First 5

      - name: Verify the tamper-evident log chain
        run: python tools/verify_log.py smoke.jsonl

      - name: Stage release artifact
        shell: pwsh
        run: |
          cmake --install '${{ matrix.binary_dir }}' `
            --config Release `
            --prefix '${{ matrix.install_dir }}'
          $collector = Join-Path '${{ matrix.install_dir }}' 'bin\anticheat.exe'
          $digest = (Get-FileHash -Algorithm SHA256 $collector).Hash.ToLowerInvariant()
          "$digest  anticheat.exe" |
            Set-Content -Encoding ascii '${{ matrix.install_dir }}\SHA256SUMS'
          Copy-Item smoke.jsonl '${{ matrix.install_dir }}\smoke.jsonl'

      - name: Upload collector package
        uses: actions/upload-artifact@v7
        with:
          name: anticheat-${{ matrix.arch }}
          path: ${{ matrix.install_dir }}
          if-no-files-found: error

  macos:
    name: macos user-mode collector
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake --preset macos

      - name: Build
        run: cmake --build --preset macos-release

      - name: Test
        run: ctest --preset macos-release

      - name: Verify automated test inventory
        run: |
          count=$(ctest --preset macos-release -N | sed -n 's/^Total Tests: //p')
          test "$count" = 23

      - name: Install
        run: cmake --install out/build/macos --prefix out/install/macos

      - name: End-to-end self scan
        run: |
          out/install/macos/bin/anticheat \
            --self \
            --once \
            --quiet \
            --log macos-smoke.jsonl

      - name: Verify the tamper-evident log chain
        run: python3 tools/verify_log.py macos-smoke.jsonl

      - name: Stage release artifact
        run: |
          shasum -a 256 out/install/macos/bin/anticheat \
            | sed 's#out/install/macos/bin/##' \
            > out/install/macos/SHA256SUMS
          cp macos-smoke.jsonl out/install/macos/smoke.jsonl

      - name: Upload collector package
        uses: actions/upload-artifact@v7
        with:
          name: anticheat-macos
          path: out/install/macos
          if-no-files-found: error

  linux:
    name: linux user-mode collector
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B out/build/linux -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build out/build/linux --parallel

      - name: Verify automated test inventory
        run: |
          count=$(ctest --test-dir out/build/linux -N | sed -n 's/^Total Tests: //p')
          test "$count" = 23

      - name: Test
        run: ctest --test-dir out/build/linux --output-on-failure

      - name: Install and stage release artifact
        run: |
          cmake --install out/build/linux --prefix out/install/linux
          out/install/linux/bin/anticheat \
            --self --once --quiet --log linux-smoke.jsonl
          python3 tools/verify_log.py linux-smoke.jsonl
          sha256sum out/install/linux/bin/anticheat \
            | sed 's#out/install/linux/bin/##' \
            > out/install/linux/SHA256SUMS
          cp linux-smoke.jsonl out/install/linux/smoke.jsonl

      - name: Upload collector package
        uses: actions/upload-artifact@v7
        with:
          name: anticheat-linux-x64
          path: out/install/linux
          if-no-files-found: error

  portable-core:
    name: portable core (sanitizers)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build and test under AddressSanitizer and UBSan
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Log verifier self-test
        run: python3 tools/verify_log.py --self-test
