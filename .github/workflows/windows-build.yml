name: build-and-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: windows ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            preset: windows-x64
            binary_dir: out/build/windows-x64
          - arch: Win32
            preset: windows-win32
            binary_dir: out/build/windows-win32

    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}-release

      - name: Verify automated test inventory
        shell: pwsh
        run: |
          $inventory = (
            & ctest --preset ${{ matrix.preset }}-release --show-only=json-v1 |
              Out-String |
              ConvertFrom-Json
          )
          if ($inventory.tests.Count -ne 24) {
            throw "Expected 24 independent tests, found $($inventory.tests.Count)"
          }

      - name: Test
        run: ctest --preset ${{ matrix.preset }}-release

      - name: End-to-end scan against a live process
        shell: pwsh
        run: |
          $collector = Join-Path '${{ matrix.binary_dir }}' 'Release\anticheat.exe'
          $target = Start-Process -PassThru -FilePath powershell `
            -ArgumentList '-NoProfile','-Command','Start-Sleep -Seconds 120'
          try {
            & $collector --pid $target.Id --once --quiet --log smoke.jsonl
            if ($LASTEXITCODE -ne 0) {
              throw "agent exited with $LASTEXITCODE"
            }
          } finally {
            Stop-Process -Id $target.Id -Force -ErrorAction SilentlyContinue
          }
          Get-Content smoke.jsonl | Select-Object -First 5

      - name: Verify the tamper-evident log chain
        run: python tools/verify_log.py smoke.jsonl

      - name: Upload agent and sample log
        uses: actions/upload-artifact@v4
        with:
          name: anticheat-${{ matrix.arch }}
          path: |
            ${{ matrix.binary_dir }}/Release/anticheat.exe
            smoke.jsonl
          if-no-files-found: error

  portable-core:
    name: portable core (sanitizers)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Build and test under AddressSanitizer and UBSan
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Log verifier self-test
        run: python3 tools/verify_log.py --self-test
